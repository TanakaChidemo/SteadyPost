openapi: 3.0.3
info:
  title: Social Media Content Publishing System API
  version: 0.1.0
  description: >
    Core backend API (Express) for authentication, content management,
    AI generation proxying, and publishing to Facebook/Instagram.
servers:
  - url: http://localhost:4000/api/v1
    description: Local development

tags:
  - name: Auth
  - name: Content
  - name: AI
  - name: Posts
  - name: Publish
  - name: SocialAccounts
  - name: Website

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password, name]
              properties:
                email: { type: string, format: email }
                password: { type: string, minLength: 8 }
                name: { type: string }
      responses:
        "201": { description: User created, tokens issued }
        "409": { description: Email already registered }

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email/password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email: { type: string, format: email }
                password: { type: string }
      responses:
        "200": { description: Tokens issued }
        "401": { description: Invalid credentials }

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Exchange a refresh token for a new access token
      responses:
        "200": { description: New access token }

  /auth/oauth/meta:
    get:
      tags: [Auth]
      summary: Begin Meta (Facebook/Instagram) OAuth linking flow
      security: [{ bearerAuth: [] }]
      responses:
        "302": { description: Redirect to Meta's OAuth dialog }

  /content:
    get:
      tags: [Content]
      summary: List content drafts for the authenticated user
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: List of drafts }
    post:
      tags: [Content]
      summary: Create a new content draft
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, body]
              properties:
                title: { type: string }
                body: { type: string }
                platforms:
                  type: array
                  items: { type: string, enum: [facebook, instagram] }
      responses:
        "201": { description: Draft created }

  /content/{id}:
    get:
      tags: [Content]
      summary: Get a draft by ID
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200": { description: Draft }
        "404": { description: Not found }
    put:
      tags: [Content]
      summary: Update a draft (creates a new version entry)
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "200": { description: Updated draft }
    delete:
      tags: [Content]
      summary: Delete a draft
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idParam"
      responses:
        "204": { description: Deleted }

  /ai/generate-caption:
    post:
      tags: [AI]
      summary: Generate an AI caption for a topic + platform
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [topic]
              properties:
                topic: { type: string }
                platform: { type: string }
                tone: { type: string }
      responses:
        "200": { description: Generated caption }

  /ai/suggest-hashtags:
    post:
      tags: [AI]
      summary: Suggest hashtags for a piece of content
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Hashtag list }

  /ai/repurpose:
    post:
      tags: [AI]
      summary: Repurpose content across target platforms
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Repurposed content per platform }

  /ai/generate-variants:
    post:
      tags: [AI]
      summary: Generate platform-native variants from an idea
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idea]
              properties:
                idea: { type: string }
                channels: { type: array, items: { type: string } }
                tone: { type: string }
      responses:
        "200": { description: Platform-native variants }

  /posts/generate-variants:
    post:
      tags: [Posts]
      summary: Generate platform-native variants and optionally save as drafts
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [idea]
              properties:
                idea: { type: string }
                channels: { type: array, items: { type: string } }
                tone: { type: string }
                saveAsDrafts: { type: boolean }
      responses:
        "200": { description: Generated variants with optional saved drafts }

  /posts/top-performing:
    get:
      tags: [Posts]
      summary: Get top performing workspace posts (PostMetrics read path)
      security: [{ bearerAuth: [] }]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, default: 10 }
        - name: channel
          in: query
          schema: { type: string }
        - name: metric
          in: query
          schema: { type: string, default: engagement }
      responses:
        "200": { description: Top performing posts ranked by engagement score }

  /posts/{id}/repurpose:
    post:
      tags: [Posts]
      summary: Repurpose a specific post into platform-native variants for target channels
      security: [{ bearerAuth: [] }]
      parameters:
        - $ref: "#/components/parameters/idParam"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [targetChannels]
              properties:
                targetChannels: { type: array, items: { type: string } }
                tone: { type: string }
                saveAsDrafts: { type: boolean }
      responses:
        "200": { description: Repurposed variants }

  /posts/batch-create:
    post:
      tags: [Posts]
      summary: Batch create multiple draft posts
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [posts]
              properties:
                posts:
                  type: array
                  items:
                    type: object
                    required: [channel, body]
                    properties:
                      channel: { type: string }
                      title: { type: string }
                      body: { type: string }
                      hashtags: { type: array, items: { type: string } }
      responses:
        "201": { description: Created posts }

  /publish/now:
    post:
      tags: [Publish]
      summary: Publish a draft immediately
      security: [{ bearerAuth: [] }]
      responses:
        "202": { description: Publish job accepted }

  /publish/status/{scheduledPostId}:
    get:
      tags: [Publish]
      summary: Check publish status
      security: [{ bearerAuth: [] }]
      parameters:
        - name: scheduledPostId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        "200": { description: Status }

  /social-accounts:
    get:
      tags: [SocialAccounts]
      summary: List linked social accounts
      security: [{ bearerAuth: [] }]
      responses:
        "200": { description: Linked accounts }

  /website/preview:
    post:
      tags: [Website]
      summary: Read a business website once and return the details it exposes (nothing is saved)
      description: >
        Fetches the page and extracts name, address, opening hours, services,
        logo and content feed URL from schema.org markup (JSON-LD or
        microdata) and Open Graph tags. With no markup (e.g. a single-page
        app), the name falls back to the page title and the logo to an
        apple-touch-icon or SVG/PNG icon. A bare domain ("rosiesbakery.co.uk")
        is read as https. A timeout is retried once, for hosts that wake
        sleeping sites on the first request. Used to prefill onboarding.
        Private, loopback and reserved addresses are refused. Rate limited to
        20 requests per 15 minutes.
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: "rosiesbakery.co.uk" }
      responses:
        "200":
          description: >
            Extracted fields. `found` is false when the page has no usable
            markup; each field is null when not found. `sources` says where
            each found field came from (json-ld, microdata, open-graph, html).
        "400": { description: Invalid payload }
        "422": { description: URL is invalid or points to a private/reserved address }
        "502": { description: The website failed (unreachable, HTTP error, not HTML, too large, too many redirects) }
        "504": { description: The website took too long to respond }

  /website/connection:
    get:
      tags: [Website]
      summary: The current workspace's connected website and its saved fields (for onboarding prefill)
      description: >
        Scoped to the active workspace (or `X-Workspace-Id`). Any member of
        the workspace can read it.
      security: [{ bearerAuth: [] }]
      responses:
        "200":
          description: >
            Saved connection: `id`, `workspaceId`, `url`, `lastSyncedTime`,
            `found`, `fields` and `sources`, in the same shape as
            `/website/preview`.
        "403": { description: Not a member of the requested workspace }
        "404": { description: No website connected to this workspace }
    put:
      tags: [Website]
      summary: Connect a website to the current workspace, or refresh it
      description: >
        Reads the site once (as `/website/preview` does) and saves the URL,
        extracted fields and sync time as the workspace's one website
        connection. Calling it again refreshes the saved fields. A failed
        fetch leaves any saved connection unchanged. Owners and editors only.
        Shares the preview rate limit (20 requests per 15 minutes).
      security: [{ bearerAuth: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [url]
              properties:
                url: { type: string, example: "rosiesbakery.co.uk" }
      responses:
        "200": { description: The saved connection (same shape as GET) }
        "400": { description: Invalid payload }
        "403": { description: Not a member of the workspace, or a viewer }
        "422": { description: URL is invalid or points to a private/reserved address }
        "502": { description: The website failed (unreachable, HTTP error, not HTML, too large, too many redirects) }
        "504": { description: The website took too long to respond }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    idParam:
      name: id
      in: path
      required: true
      schema: { type: string }
