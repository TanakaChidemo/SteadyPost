name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm test
        env:
          NODE_ENV: test
          JWT_ACCESS_SECRET: test_secret
          JWT_REFRESH_SECRET: test_refresh_secret

  frontend:
    name: Frontend (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm install
      - run: npm run lint
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: http://localhost:4000/api/v1

  ai-service:
    name: AI Service (lint + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -r requirements.txt
      - run: pip install flake8 pytest
      - run: flake8 app --max-line-length=100
      - run: pytest || true # placeholder until test suite is added

  docker-build:
    name: Build Docker images
    runs-on: ubuntu-latest
    needs: [backend, frontend, ai-service]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build --target production -t steadypost-backend:${{ github.sha }} ./backend
      - name: Build frontend image
        run: docker build --target production -t steadypost-frontend:${{ github.sha }} ./frontend
      - name: Build ai-service image
        run: docker build --target production -t steadypost-ai-service:${{ github.sha }} ./ai-service
      # TODO: push to your registry (GHCR/ECR/Docker Hub) and trigger deploy step
