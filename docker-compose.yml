version: "3.9"

# -----------------------------------------------------------------------------
# SteadyPost — Social Media Content Publishing System
# Local development orchestration
# -----------------------------------------------------------------------------
# Services:
#   frontend     - Next.js 14 dashboard (App Router)
#   backend      - Express.js API gateway / core backend (in-memory data,
#                  nothing is persisted — restarting the container resets it)
#   ai-service   - Flask microservice for AI content generation (Groq)
# -----------------------------------------------------------------------------

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    container_name: steadypost_frontend
    ports:
      - "3100:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_API_BASE_URL=http://localhost:4000/api/v1
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    depends_on:
      - backend
    networks:
      - steadypost_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: development
    container_name: steadypost_backend
    ports:
      - "4000:4000"
    env_file:
      - ./backend/.env
    environment:
      - NODE_ENV=development
      - PORT=4000
      - AI_SERVICE_URL=http://ai-service:5001
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    depends_on:
      - ai-service
    networks:
      - steadypost_network

  ai-service:
    build:
      context: ./ai-service
      dockerfile: Dockerfile
      target: development
    container_name: steadypost_ai_service
    ports:
      - "5001:5001"
    env_file:
      - ./ai-service/.env
    environment:
      - FLASK_ENV=development
      - PORT=5001
    volumes:
      - ./ai-service:/app
    networks:
      - steadypost_network

volumes:
  frontend_node_modules:
  backend_node_modules:

networks:
  steadypost_network:
    driver: bridge
